plugins { id 'org.jetbrains.kotlin.jvm' }


dependencies {
	// Steam's protocol client and its depot downloader (Kotlin/Java, no Steam client program needed).
	api 'in.dragonbra:javasteam:1.8.0'
	api 'in.dragonbra:javasteam-depotdownloader:1.8.0'
	api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
	// Mod archives: 7z (with its LZMA) beside zip. org.json is Android's own at run time; the jar is for the JVM tests only.
	implementation 'org.apache.commons:commons-compress:1.27.1'
	implementation 'org.tukaani:xz:1.10'
	compileOnly 'org.json:json:20240303'
	testImplementation 'org.json:json:20240303'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.10.2'
	// JavaSteam's crypto helper finds its JCE provider by class name: BouncyCastle on a JVM, SpongyCastle on Android (app/build.gradle).
	testImplementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.3.21'
}

test { useJUnit() }
