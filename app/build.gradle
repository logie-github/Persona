plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.plugin.compose'
}

// CI passes the version (-PpersonaVersionCode, -PpersonaVersionName); local builds use these.
def prop = { String name, String fallback ->
	def value = project.hasProperty(name) ? project.property(name).toString() : ""
	value.isEmpty() ? fallback : value
}

android {
	namespace = 'com.logie.persona'
	compileSdk = 35

	buildFeatures { compose = true; buildConfig = true }

	defaultConfig {
		applicationId = 'com.logie.persona'
		minSdk = 26
		// 28, like Blizzard and Winlator: Android lets apps that target 28 or lower run programs from their own storage.
		//noinspection ExpiredTargetSdkVersion
		targetSdk = 28
		versionCode = prop('personaVersionCode', '1').toInteger()
		versionName = prop('personaVersionName', '1.0')
		// Updates come from this repository's releases (persona-build-N, N being the version code).
		buildConfigField "String", "UPDATE_REPO", "\"${prop('personaUpdateRepo', 'logie-github/Persona')}\""
		buildConfigField "String", "RELEASE_TAG_PREFIX", "\"persona-build\""
		ndk { abiFilters "arm64-v8a" }
	}

	// One key for every build, so each release installs over the last.
	signingConfigs {
		sideload {
			storeFile = file('sideload.keystore')
			storePassword = 'persona'
			keyAlias = 'persona'
			keyPassword = 'persona'
		}
	}
	buildTypes {
		debug { signingConfig = signingConfigs.sideload }
		release {
			signingConfig = signingConfigs.sideload
			minifyEnabled = false
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	packaging {
		resources { excludes += ['META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'META-INF/*.kotlin_module'] }
	}

	testOptions.unitTests.includeAndroidResources = true
	testOptions.unitTests.all {
		systemProperty 'robolectric.graphicsMode', 'NATIVE'
		systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
		maxHeapSize = '2g'
	}

	lint { abortOnError = false; checkReleaseBuilds = false }
}

dependencies {
	implementation project(':backend')
	implementation platform('androidx.compose:compose-bom:2025.04.00')
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.material3:material3'
	implementation 'androidx.activity:activity-compose:1.9.3'
	implementation 'androidx.core:core-ktx:1.12.0'
	implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.robolectric:robolectric:4.16'
	testImplementation 'androidx.test:core:1.6.1'
	debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
