plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.plugin.compose'
}

// CI passes the version (-PpersonaVersionCode, -PpersonaVersionName); local builds use these.
def prop = { String name, String fallback ->
	def value = project.hasProperty(name) ? project.property(name).toString() : ""
	value.isEmpty() ? fallback : value
}

// The Windows games' runtime, Winlator (scripts/prepare-winlator.sh puts it in app/winlator, git-ignored), and the Steam emulator the games
// run with instead of the Steam client (scripts/prepare-steamemu.sh puts it in app/steamemu; optional for a local build: without it a
// game starts with its own steam_api).
def winlator = file("winlator")
if (!new File(winlator, "java").isDirectory()) {
	throw new GradleException("Winlator isn't in app/winlator: run scripts/prepare-winlator.sh")
}

android {
	namespace = 'com.logie.persona'
	compileSdk = 36
	// The emulator's native library is stripped of its debug symbols at packaging (it needs this NDK to find the tool): 209 MB becomes a fraction of that.
	ndkVersion = '29.0.14206865'

	buildFeatures { compose = true; buildConfig = true }

	defaultConfig {
		applicationId = 'com.logie.persona'
		minSdk = 26
		// 28, like Blizzard and Winlator: Android lets apps that target 28 or lower run programs from their own storage.
		//noinspection ExpiredTargetSdkVersion
		targetSdk = 28
		versionCode = prop('personaVersionCode', '1').toInteger()
		versionName = prop('personaVersionName', '1.0')
		// Updates come from this repository's releases (persona-build-N, N being the version code).
		buildConfigField "String", "UPDATE_REPO", "\"${prop('personaUpdateRepo', 'logie-github/Persona')}\""
		buildConfigField "String", "RELEASE_TAG_PREFIX", "\"persona-build\""
		// The token the app's reports open issues with (Issues: read and write on this repository): CI's PERSONA_REPORT_TOKEN secret,
		// as the Blizzard launcher carries its own. Empty in a build without it: reports then wait on the phone.
		buildConfigField "String", "REPORT_TOKEN", "\"${prop('personaReportToken', '')}\""
		ndk { abiFilters "arm64-v8a" }
		// Winlator's C is written for an older NDK's compiler; this one's newer errors for old C are warnings again.
		externalNativeBuild { cmake { cFlags '-Wno-error=implicit-function-declaration', '-Wno-error=incompatible-function-pointer-types', '-Wno-error=int-conversion' } }
	}

	// One key for every build, so each release installs over the last.
	signingConfigs {
		sideload {
			storeFile = file('sideload.keystore')
			storePassword = 'persona'
			keyAlias = 'persona'
			keyPassword = 'persona'
		}
	}
	buildTypes {
		debug { signingConfig = signingConfigs.sideload }
		release {
			signingConfig = signingConfigs.sideload
			minifyEnabled = false
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	// Winlator's native code (its X server, renderers, audio), with CMake.
	externalNativeBuild {
		cmake {
			path = file("winlator/cpp/CMakeLists.txt")
			version = "3.22.1"
		}
	}

	packaging {
		jniLibs {
			useLegacyPackaging = true
			// Winlator's prebuilt libraries and the PSP emulator both bring the C++ runtime; the app's copy is made the NDK's own (prepareCxxShared), so both are the same file.
			pickFirsts += ['lib/arm64-v8a/libc++_shared.so']
		}
		resources { excludes += ['META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'META-INF/*.kotlin_module'] }
	}

	// Winlator's runtime, the Steam emulator's files (scripts/prepare-steamemu.sh) and the session's keeper (borderless.exe,
	// scripts/build-keeper.sh) are part of the app's assets. (The Persona 1 skin, skins/violet, is no longer in the app: every game has its
	// Persona look in the launcher.)
	sourceSets.main.assets.srcDirs += ['winlator/assets', 'steamemu/assets', 'keeper/assets']
	sourceSets.main.java.srcDirs += ['winlator/java']
	sourceSets.main.res.srcDirs += ['winlator/res']
	sourceSets.main.jniLibs.srcDirs += ['winlator/jniLibs']

	androidResources {
		// Already compressed (Winlator's runtime archives).
		noCompress += ['tzst', 'zip']
	}

	testOptions.unitTests.includeAndroidResources = true
	testOptions.unitTests.all {
		systemProperty 'robolectric.graphicsMode', 'NATIVE'
		systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
		maxHeapSize = '2g'
		systemProperty 'persona.shots', System.getenv('PERSONA_SHOTS') ?: "${rootProject.buildDir}/shots"
	}

	lint { abortOnError = false; checkReleaseBuilds = false }
}

dependencies {
	implementation project(':backend')
	// The PSP emulator (PPSSPP, built from its own source): its activity is what PspActivity builds on.
	implementation project(':ppsspp')
	implementation 'androidx.appcompat:appcompat:1.7.1'
	// Draws the sign-in approval link as a QR code.
	implementation 'com.google.zxing:core:3.5.3'
	// Winlator's.
	implementation 'com.google.android.material:material:1.11.0'
	implementation 'org.apache.commons:commons-compress:1.27.1'
	implementation 'org.tukaani:xz:1.10'
	implementation 'androidx.preference:preference:1.2.1'
	implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
	implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
	// Steam's sign-in encrypts the password with a provider JavaSteam looks up by name on Android: without these the sign-in cannot start.
	implementation 'com.madgag.spongycastle:core:1.58.0.0'
	implementation 'com.madgag.spongycastle:prov:1.58.0.0'
	implementation platform('androidx.compose:compose-bom:2025.04.00')
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.material3:material3'
	implementation 'androidx.activity:activity-compose:1.9.3'
	implementation 'androidx.core:core-ktx:1.12.0'
	implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.robolectric:robolectric:4.16'
	testImplementation 'androidx.test:core:1.6.1'
	testImplementation 'androidx.compose.ui:ui-test-junit4'
	debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// The C++ runtime Winlator's prebuilt libraries link against, made the NDK's own (the PSP emulator's is the same NDK's): one file, whichever
// copy the packaging picks.
def prepareCxxShared = tasks.register('prepareCxxShared') {
	def host = System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin-x86_64' : 'linux-x86_64'
	def ndk = new File(androidComponents.sdkComponents.sdkDirectory.get().asFile, "ndk/${android.ndkVersion}")
	def from = new File(ndk, "toolchains/llvm/prebuilt/$host/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so")
	def to = file('winlator/jniLibs/arm64-v8a/libc++_shared.so')
	inputs.file(from); outputs.file(to)
	doLast { java.nio.file.Files.copy(from.toPath(), to.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
}
tasks.named('preBuild').configure { dependsOn prepareCxxShared }
