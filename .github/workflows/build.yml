name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # The PSP emulator (PPSSPP) is built from its own source, patched by patches/ppsspp. Its NDK and CMake come from the runner's SDK.
      - run: sh scripts/prepare-ppsspp.sh
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null
      # The Windows games' runtime, Winlator (patched by patches/winlator; its runtime's archives rewritten for this app's path), kept in a cache by
      # what makes it; and the Steam emulator they run with (gbe_fork's Windows libraries).
      - name: Look for Winlator
        id: winlator
        uses: actions/cache/restore@v4
        with:
          path: app/winlator
          key: persona-winlator-v1-${{ hashFiles('winlator-version.env', 'patches/winlator/**', 'scripts/prepare-winlator.sh', 'scripts/winlator-rewrite.py') }}
      - name: Prepare Winlator
        if: steps.winlator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-zstandard > /dev/null
          scripts/prepare-winlator.sh
      - name: Save Winlator
        if: steps.winlator.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/winlator
          key: ${{ steps.winlator.outputs.cache-primary-key }}
      - name: Steam emulator
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          command -v 7z > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full > /dev/null; }
          scripts/prepare-steamemu.sh
      # Release build, signed with the app's own key so each release installs over the last.
      - name: Build and test
        env:
          # The reports' token (Issues: read and write on this repository), built into the app as the Blizzard launcher's is.
          PERSONA_REPORT_TOKEN: ${{ secrets.PERSONA_REPORT_TOKEN }}
        run: >
          ./gradlew :backend:test :app:testDebugUnitTest :app:assembleRelease
          -PpersonaVersionCode=${{ github.run_number }} -PpersonaVersionName=1.0.${{ github.run_number }}
          -PpersonaReportToken="$PERSONA_REPORT_TOKEN"
      - run: cp app/build/outputs/apk/release/app-release.apk Persona.apk
      - uses: actions/upload-artifact@v4
        with: { name: Persona, path: Persona.apk }

  # Only once the APK is built and the tests have passed. The app looks for persona-build-N releases (the number is the
  # version code) each time it comes to the front and installs a newer one. Released from main and, until there is a
  # main, from the session branches (ccr-*).
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ccr-'))
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: Persona }
      - name: Patch notes
        run: scripts/release-notes.sh | tee release-notes.md
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: >
          gh release create "persona-build-${{ github.run_number }}" Persona.apk
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}" --title "Persona 1.0.${{ github.run_number }}"
          --notes-file release-notes.md
