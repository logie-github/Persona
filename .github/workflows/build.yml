name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :backend:test :app:testDebugUnitTest :app:assembleDebug -PpersonaVersionCode=${{ github.run_number }} -PpersonaVersionName=build-${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: persona-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
